# RAG Backborn — production stack.
#   cd deploy && docker compose -p ragb up -d --build
name: ragb
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragb}
      POSTGRES_USER: ${POSTGRES_USER:-ragb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ragb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragb} -d ${POSTGRES_DB:-ragb}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [ragb-net]

  # Object storage. One process runs master, volume, filer and the S3 gateway: this is a
  # single-machine deployment and three containers to coordinate would be ceremony. Blobs
  # live in a volume, so no pod ever serves a file another pod wrote to its own disk.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: ragb-seaweedfs
    restart: unless-stopped
    # The identity file is written at boot rather than bind-mounted: Docker creates a missing
    # mount source as a *directory*, and the gateway then dies with "is a directory" forever.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        printf '{"identities":[{"name":"ragb","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging","Admin"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=0 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json -filer -ip=seaweedfs
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ragb}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - ragb-seaweed:/data
    expose: ["8333"]
    healthcheck:
      # An authenticated gateway answers anonymous requests with 403, which wget calls a
      # failure — so a plain wget check could only pass while auth was broken. What matters
      # is that something speaks HTTP on the port.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    networks: [ragb-net]

  backend:
    build:
      context: ../backend
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.236}
    image: ragb-backend
    container_name: ragb-backend
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_started}
    environment: &backend_env
      RAGB_PUBLIC_URL: ${RAGB_PUBLIC_URL:?set RAGB_PUBLIC_URL}
      RAGB_SECRET_KEY: ${RAGB_SECRET_KEY:?set RAGB_SECRET_KEY}
      RAGB_ENCRYPTION_KEY: ${RAGB_ENCRYPTION_KEY:-}
      RAGB_ENCRYPTION_KEY_PREVIOUS: ${RAGB_ENCRYPTION_KEY_PREVIOUS:-}
      RAGB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ragb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ragb}
      RAGB_DATA_DIR: /data
      RAGB_S3_ENDPOINT: ${RAGB_S3_ENDPOINT:-http://seaweedfs:8333}
      RAGB_S3_BUCKET: ${RAGB_S3_BUCKET:-ragb}
      RAGB_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ragb}
      RAGB_S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      RAGB_CLAUDE_HOME: /home/ragb/.claude
      CLAUDE_CONFIG_DIR: /home/ragb/.claude
      RAGB_DEFAULT_ADMIN_ENABLED: ${RAGB_DEFAULT_ADMIN_ENABLED:-true}
      RAGB_DEFAULT_ADMIN_EMAIL: ${RAGB_DEFAULT_ADMIN_EMAIL:-admin@ragb.local}
      RAGB_DEFAULT_ADMIN_PASSWORD: ${RAGB_DEFAULT_ADMIN_PASSWORD:-admin123}
      RAGB_LOG_LEVEL: ${RAGB_LOG_LEVEL:-INFO}
      RAGB_TIMEZONE: ${TZ:-Asia/Seoul}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ragb-data:/data
      # $HOME is its own volume so the CLI can keep state files next to .claude even though
      # the image layer is read-only; the deeper .claude mount still wins.
      - ragb-home:/home/ragb
      - ragb-claude:/home/ragb/.claude
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /home/ragb/.cache:rw,nosuid,nodev,size=256m,uid=10001,gid=10001
    expose: ["8000"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    networks: [ragb-net]

  worker:
    image: ragb-backend
    container_name: ragb-worker
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      backend: {condition: service_started}
    environment:
      <<: *backend_env
      RAGB_INTERNAL_API_URL: http://backend:8000
      RAGB_WORKER_ID: worker-1
    volumes:
      - ragb-data:/data
      - ragb-home:/home/ragb
      - ragb-claude:/home/ragb/.claude
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /home/ragb/.cache:rw,nosuid,nodev,size=256m,uid=10001,gid=10001
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    healthcheck:
      # A wedged worker keeps its process alive, so restart policies never notice. The
      # liveness file is the only thing that separates "running" from "stuck".
      test: ["CMD-SHELL", "python -c \"import pathlib,time,sys; p=pathlib.Path('/data/.worker-alive'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 240 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks: [ragb-net]

  frontend:
    build:
      context: ../frontend
    image: ragb-frontend
    container_name: ragb-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose: ["3000"]
    depends_on: [backend]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /app/.next/cache:rw,nosuid,nodev,size=64m,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    healthcheck:
      # /login renders without a backend round trip, so this stays a check of the Next
      # server itself rather than of the API behind it.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [ragb-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: ragb-nginx
    restart: unless-stopped
    depends_on: [backend, frontend]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${NGINX_PORT:-58800}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,size=32m
      - /var/run:rw,size=8m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    networks: [ragb-net]

volumes:
  ragb-pgdata:
  ragb-data:
  ragb-seaweed:
  ragb-home:
  ragb-claude:

networks:
  ragb-net:
