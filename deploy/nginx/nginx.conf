# Docker's embedded DNS. Without this, nginx resolves `backend` and `frontend` once at
# startup and caches the IPs forever — so every `compose up --build backend` hands the
# container a new IP and nginx 502s until someone restarts it. The `proxy_pass` targets
# below are variables on purpose: a literal name is resolved at config load, a variable is
# resolved per request through this resolver.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 60m;

    # Behind a Cloudflare tunnel; the edge terminates TLS and sets these.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;

    set $api http://backend:8000;
    set $web http://frontend:3000;

    # The loopback MCP bridge is reachable only from inside the backend container. Exposing
    # it would hand anyone holding a turn token the agent's tool surface.
    location /api/internal/ { return 404; }

    location /api/chat/turn {
        proxy_pass $api$request_uri;
        # Server-sent events: no buffering anywhere, and a read timeout long enough for a
        # multi-round agentic turn to finish thinking.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass $api/health;
        access_log off;
    }

    location / {
        proxy_pass $web$request_uri;
        proxy_read_timeout 120s;
    }
}
