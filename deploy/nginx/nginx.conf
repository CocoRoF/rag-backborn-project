upstream ragb_api { server backend:8000; }
upstream ragb_web { server frontend:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 60m;

    # Behind a Cloudflare tunnel; the edge terminates TLS and sets these.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;

    # The loopback MCP bridge is reachable only from inside the backend container. Exposing
    # it would hand anyone holding a turn token the agent's tool surface.
    location /api/internal/ { return 404; }

    location /api/chat/turn {
        proxy_pass http://ragb_api;
        # Server-sent events: no buffering anywhere, and a read timeout long enough for a
        # multi-round agentic turn to finish thinking.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://ragb_api;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://ragb_api/health;
        access_log off;
    }

    location / {
        proxy_pass http://ragb_web;
        proxy_read_timeout 120s;
    }
}
